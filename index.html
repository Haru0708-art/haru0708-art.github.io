<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルドキュメントビューア</title>
  <style>
    /* ==========================================================================
       ベース設定・カスタムプロパティ（デザインシステム）
       システムフォントのみを使用し、OSのダークモード設定にも自動対応します
       ========================================================================== */
    :root {
      --bg-color: #f8fafc;
      --surface-color: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --border-color: #e2e8f0;
      --nav-bg: rgba(255, 255, 255, 0.92);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius-lg: 16px;
      --radius-full: 9999px;
      /* OS標準の日本語・欧文システムフォントスタック */
      --font-sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", Meiryo, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --surface-color: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --accent-color: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-soft: rgba(59, 130, 246, 0.15);
        --border-color: #334155;
        --nav-bg: rgba(30, 41, 59, 0.92);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      }
    }

    /* リセットと基本レイアウト */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.85;
      /* 画面幅に応じて文字サイズを滑らかに調整（最小15px〜最大17px） */
      font-size: clamp(0.9375rem, 0.9rem + 0.25vw, 1.0625rem);
      /* 下部固定ナビゲーションに本文が隠れないよう十分な余白を確保 */
      padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ==========================================================================
       レイアウトコンテナ（広い画面と狭い画面の両方で読みやすい幅に制限）
       ========================================================================== */
    .container {
      width: 100%;
      /* 1行あたり35〜45文字前後になる読みやすい最大幅（約720px） */
      max-width: 45rem;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1rem, 4vw, 1.5rem);
    }

    /* ヘッダー領域 */
    .site-header {
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .site-title {
      font-size: clamp(1.125rem, 1rem + 0.5vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .status-badge {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: var(--accent-soft);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
    }

    /* ==========================================================================
       記事コンテンツカード（文章A・文章B・文章Cの表示領域）
       ========================================================================== */
    .article-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 5vw, 3rem);
      box-shadow: var(--shadow-sm);
      /* 状態切り替え時のフェードインアニメーション */
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 非表示状態の制御 */
    .article-card[hidden] {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .article-category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    .article-title {
      font-size: clamp(1.375rem, 1.2rem + 1vw, 1.875rem);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    .article-body p {
      color: var(--text-secondary);
      margin-bottom: 1.4em;
      text-align: justify;
      word-break: break-word;
    }

    .article-body p:last-child {
      margin-bottom: 0;
    }

    .article-highlight {
      background-color: var(--accent-soft);
      border-left: 4px solid var(--accent-color);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
      color: var(--text-primary);
      font-size: 0.95em;
    }

    /* ==========================================================================
       画面下部の固定ナビゲーションバー（3状態切り替えボタン）
       ========================================================================== */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
      pointer-events: none; /* 背景部分のタップ透過 */
    }

    .bottom-nav {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      width: 100%;
      max-width: 28rem;
      background-color: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.375rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
    }

    .nav-btn {
      flex: 1;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: clamp(0.875rem, 0.82rem + 0.25vw, 0.95rem);
      font-weight: 600;
      /* タッチ操作しやすい十分な高さ（44px以上）を確保 */
      min-height: 2.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-btn:hover:not([aria-selected="true"]) {
      color: var(--text-primary);
      background-color: rgba(148, 163, 184, 0.12);
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    /* 選択中のボタンのスタイル */
    .nav-btn[aria-selected="true"] {
      background-color: var(--accent-color);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    /* 狭い画面（スマートフォン縦向きなど）向けの微調整 */
    @media (max-width: 480px) {
      .article-card {
        border-radius: 12px;
      }
      .article-body p {
        text-align: left; /* 狭い画面での不自然な単語間スペースを防止 */
      }
    }
  </style>
</head>
<body>

  <!-- メインコンテンツ領域 -->
  <div class="container">
    <header class="site-header">
      <h1 class="site-title">ドキュメントビューア</h1>
      <span id="current-status-label" class="status-badge" aria-live="polite">現在：文章Aを表示中</span>
    </header>

    <main id="main-content">
      <!-- 状態1: 文章A（初期表示） -->
      <article id="panel-a" class="article-card" role="tabpanel" aria-labelledby="tab-a">
        <span class="article-category">State 01 / 自己紹介</span>
        <h2 class="article-title">文章A：自己紹介</h2>
        <div class="article-body">
          <p>私の名前は日大太郎です
                      </p>
          <p>
            好きなものは日本大学です
          </p>
        </div>
      </article>

      <!-- 状態2: 文章B -->
      <article id="panel-b" class="article-card" role="tabpanel" aria-labelledby="tab-b" hidden>
        <span class="article-category">State 02 今学んでいること/ </span>
        <h2 class="article-title">文章B：今学んでいること</h2>
        <div class="article-body">
          <p>
          価値創造学科にて価値を創造するために価値の勉強をしています！  
          </p>
        </div>
      </article>

      <!-- 状態3: 文章C -->
      <article id="panel-c" class="article-card" role="tabpanel" aria-labelledby="tab-c" hidden>
        <span class="article-category">State 03 / これからしたいこと</span>
        <h2 class="article-title">文章C：これからしたいこと</h2>
        <div class="article-body">
          <p>
            日本大学で勉強に励み価値のある人間になりたい！
            <a href="https://www.nihon-u.ac.jp/" target="_blank" rel="noopener noreferrer">日本大学公式ホームページ</a>
          </p>
          
        </div>
      </article>
    </main>
  </div>

  <!-- 画面下部の状態切り替えナビゲーション -->
  <div class="bottom-nav-wrapper">
    <nav class="bottom-nav" role="tablist" aria-label="表示する文章の切り替え">
      <button
        type="button"
        id="tab-a"
        class="nav-btn"
        role="tab"
        aria-selected="true"
        aria-controls="panel-a"
        data-target="a"
      >
        文章A
      </button>
      <button
        type="button"
        id="tab-b"
        class="nav-btn"
        role="tab"
        aria-selected="false"
        aria-controls="panel-b"
        data-target="b"
      >
        文章B
      </button>
      <button
        type="button"
        id="tab-c"
        class="nav-btn"
        role="tab"
        aria-selected="false"
        aria-controls="panel-c"
        data-target="c"
      >
        文章C
      </button>
    </nav>
  </div>

  <script>
    /**
     * 3つの状態（文章A・文章B・文章C）を切り替える制御スクリプト
     */
    (function () {
      'use strict';

      // DOM要素の取得
      const buttons = document.querySelectorAll('.nav-btn');
      const statusLabel = document.getElementById('current-status-label');

      // 状態ごとのパネルとラベルの定義
      const states = {
        a: {
          panel: document.getElementById('panel-a'),
          label: '現在：文章Aを表示中'
        },
        b: {
          panel: document.getElementById('panel-b'),
          label: '現在：文章Bを表示中'
        },
        c: {
          panel: document.getElementById('panel-c'),
          label: '現在：文章Cを表示中'
        }
      };

      /**
       * 指定された状態キー（'a' | 'b' | 'c'）へ表示を切り替える
       * @param {string} targetKey - 遷移先の状態キー
       */
      function switchState(targetKey) {
        if (!states[targetKey]) return;

        // 1. ボタンの選択状態を更新
        buttons.forEach((btn) => {
          const isSelected = btn.dataset.target === targetKey;
          btn.setAttribute('aria-selected', String(isSelected));
        });

        // 2. 各文章パネルの表示・非表示を切り替え
        Object.keys(states).forEach((key) => {
          const panel = states[key].panel;
          if (key === targetKey) {
            panel.hidden = false;
          } else {
            panel.hidden = true;
          }
        });

        // 3. ヘッダーのステータス表示を更新
        if (statusLabel) {
          statusLabel.textContent = states[targetKey].label;
        }

        // 4. ページ上部へスムーズにスクロール（長文を途中まで読んだ後の切り替えに配慮）
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }

      // 各ボタンにクリックイベントを登録
      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetKey = btn.dataset.target;
          switchState(targetKey);
        });
      });
    })();
  </script>
</body>
</html>
